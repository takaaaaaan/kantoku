<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kantoku bot mobile</title>
<!-- Mockup only. All data below is made up. No external loads. Nothing is sent anywhere.
     kantoku bot on a phone: list and conversation as two sliding screens, a bottom sheet for info,
     a secret card that works on the phone, pairing, and lock-screen notifications. -->
<style>
:root {
  --bg-1: #fdf2f6; --bg-2: #eef4ff; --bg-3: #fff6e8;
  --blob-a: #ffc4d6; --blob-b: #bfdcff; --blob-c: #ffe1a8;
  --glass: rgba(255, 255, 255, .62); --glass-strong: rgba(255, 255, 255, .88); --glass-line: rgba(255, 255, 255, .9);
  --ink: #1d2433; --muted: #6f7a8c; --line: rgba(29, 36, 51, .08);
  --accent: #ff7a45; --accent-2: #ff4f8b; --accent-soft: rgba(255, 122, 69, .12);
  --work: #22b07d; --lock: #7c6cf0; --lock-soft: rgba(124, 108, 240, .12); --warn: #d9822b;
  --mine: linear-gradient(135deg, #6a8dff, #8f7bff);
  --shadow: 0 1px 2px rgba(29, 36, 51, .05), 0 10px 26px rgba(29, 36, 51, .08);
  --shadow-lift: 0 18px 40px rgba(29, 36, 51, .16);
  --stage: #e9edf3;
  --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --spring: cubic-bezier(.34, 1.56, .64, 1); --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-1: #0f1220; --bg-2: #121a2c; --bg-3: #1a1324; --blob-a: #6b2a4d; --blob-b: #23406e; --blob-c: #5a3d16;
    --glass: rgba(26, 31, 48, .62); --glass-strong: rgba(30, 36, 56, .92); --glass-line: rgba(255, 255, 255, .08);
    --ink: #eef1f7; --muted: #9aa5b8; --line: rgba(255, 255, 255, .08); --accent-soft: rgba(255, 122, 69, .18); --lock-soft: rgba(124, 108, 240, .22);
    --shadow: 0 10px 26px rgba(0,0,0,.35); --shadow-lift: 0 18px 40px rgba(0,0,0,.5); --stage: #0a0c12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-1: #0f1220; --bg-2: #121a2c; --bg-3: #1a1324; --blob-a: #6b2a4d; --blob-b: #23406e; --blob-c: #5a3d16;
  --glass: rgba(26, 31, 48, .62); --glass-strong: rgba(30, 36, 56, .92); --glass-line: rgba(255, 255, 255, .08);
  --ink: #eef1f7; --muted: #9aa5b8; --line: rgba(255, 255, 255, .08); --accent-soft: rgba(255, 122, 69, .18); --lock-soft: rgba(124, 108, 240, .22);
  --shadow: 0 10px 26px rgba(0,0,0,.35); --shadow-lift: 0 18px 40px rgba(0,0,0,.5); --stage: #0a0c12; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--stage); color: var(--ink); font: 14px/1.6 var(--font); }
button, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- review page around the phones (not part of the app) ---------- */
.intro { max-width: 1240px; margin: 0 auto; padding: 24px 16px 4px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; }
.intro h1 { font-size: 20px; margin: 0; }
.intro p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 320px; }
.intro .tools { display: flex; gap: 6px; }
.intro .tools button { border: 0; background: var(--line); border-radius: 10px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
.stage { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; padding: 20px 16px 48px; }
figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
figcaption { font-size: 12.5px; color: var(--muted); max-width: 290px; text-align: center; }
figcaption b { color: var(--ink); }

/* ---------- phone ---------- */
.phone { width: 300px; height: 630px; border-radius: 42px; position: relative; overflow: hidden; isolation: isolate;
  background: linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, var(--bg-3)); box-shadow: 0 0 0 10px #0d1117, 0 24px 50px rgba(0,0,0,.28); }
.phone::before, .phone::after { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; filter: blur(50px); opacity: .8; z-index: -1; animation: drift 22s ease-in-out infinite alternate; }
.phone::before { background: var(--blob-a); left: -80px; top: -60px; }
.phone::after { background: var(--blob-b); right: -90px; bottom: 40px; animation-duration: 28s; }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.15); } }
.status { height: 34px; display: flex; justify-content: space-between; align-items: center; padding: 6px 26px 0; font-size: 11.5px; font-weight: 700; }
.views { position: absolute; inset: 34px 0 0; overflow: hidden; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform .5s var(--ease), opacity .4s, filter .4s; }
.view.behind { transform: translateX(-28%); opacity: 0; filter: blur(2px); pointer-events: none; }
.view.ahead { transform: translateX(100%); }

/* ---------- face ---------- */
.face { position: relative; width: 46px; height: 46px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff8, transparent 45%), var(--c); flex: none; display: block; }
.face svg { position: relative; z-index: 1; width: 100%; height: 100%; display: block; }
.face::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; opacity: 0; }
.face.working::before { opacity: 1; background: conic-gradient(var(--work), transparent 60%); animation: spin 1.6s linear infinite; -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%); mask: radial-gradient(circle, transparent 60%, #000 62%); }
.face.waiting { animation: breathe 2.6s ease-in-out infinite; }
.face.waiting::before { opacity: 1; inset: -5px; background: radial-gradient(circle, transparent 58%, rgba(255, 122, 69, .45) 62%, transparent 72%); animation: halo 2.6s ease-out infinite; }
.face.asleep { filter: saturate(.6); }
.face.asleep::after { content: "z"; position: absolute; right: -4px; top: -8px; font-size: 12px; font-weight: 700; color: var(--muted); animation: float-z 3s ease-in-out infinite; z-index: 2; }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes breathe { 50% { transform: scale(1.05); } }
@keyframes halo { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }
@keyframes float-z { 50% { transform: translateY(-6px); opacity: 1; } 0%, 100% { opacity: .3; } }
.face.s { width: 32px; height: 32px; } .face.xl { width: 76px; height: 76px; }

/* ---------- list screen ---------- */
.top { padding: 8px 18px 6px; display: flex; align-items: center; justify-content: space-between; }
.top h2 { font-size: 26px; margin: 0; letter-spacing: .01em; }
.conn { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); background: var(--glass-strong); border-radius: 99px; padding: 3px 10px; box-shadow: var(--shadow); }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--work); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(34,176,125,.5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(34,176,125,0); } }
.seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--line); border-radius: 99px; padding: 3px; margin: 6px 16px 8px; }
.seg button { position: relative; z-index: 1; border: 0; background: none; padding: 6px 0; border-radius: 99px; cursor: pointer; font-size: 12px; color: var(--muted); }
.seg button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc((100% - 6px) / 3); border-radius: 99px; background: var(--glass-strong); box-shadow: var(--shadow); transition: transform .45s var(--spring); }
.list { list-style: none; margin: 0; padding: 4px 12px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.list li { animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 70ms + 120ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.row { width: 100%; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--glass-line); background: var(--glass); border-radius: 20px;
  text-align: left; cursor: pointer; box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .3s var(--spring); min-height: 70px; }
.row:active { transform: scale(.97); }
.row > div { min-width: 0; }
.row .name { font-weight: 700; }
.row .say { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill { font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 99px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); white-space: nowrap; }
.pill.lock { background: var(--lock); }

/* ---------- conversation screen ---------- */
.bar { display: flex; align-items: center; gap: 8px; padding: 4px 10px 8px; }
.back { border: 0; background: var(--glass-strong); width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; box-shadow: var(--shadow); flex: none; }
.head-name { border: 0; background: none; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left; min-width: 0; padding: 2px 8px 2px 2px; border-radius: 99px; }
.head-name strong { display: block; font-size: 15px; line-height: 1.2; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); white-space: nowrap; }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); } .chip .dot.working { background: var(--work); } .chip .dot.waiting { background: var(--accent); }
.chat { flex: 1; overflow-y: auto; padding: 8px 12px 90px; display: flex; flex-direction: column; gap: 10px; }
.day { align-self: center; color: var(--muted); font-size: 10.5px; padding: 1px 10px; border-radius: 99px; background: var(--glass-strong); }
.msg { display: grid; grid-template-columns: 32px 1fr; gap: 8px; animation: bubble-in .5s var(--spring) both; animation-delay: calc(var(--i, 0) * 60ms + 200ms); }
@keyframes bubble-in { from { opacity: 0; transform: translateY(12px) scale(.96); filter: blur(4px); } }
.msg.mine { grid-template-columns: 1fr; align-self: flex-end; max-width: 85%; }
.bubble { background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 6px 20px 20px 20px; padding: 9px 12px; box-shadow: var(--shadow); min-width: 0; overflow-wrap: anywhere; position: relative; }
.mine .bubble { background: var(--mine); color: #fff; border: 0; border-radius: 20px 6px 20px 20px; }
.bubble time { display: block; color: var(--muted); font-size: 10.5px; margin-top: 3px; }
.mine .bubble time { color: rgba(255,255,255,.8); }
.tag { display: flex; gap: 6px; font-size: 10.5px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
.ask, .secret { border: 0; }
.ask::before, .secret::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; background: linear-gradient(135deg, var(--accent), var(--accent-2), #ffc46b);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.secret::before { background: linear-gradient(135deg, var(--lock), #b49cff); }
.secret .tag { color: var(--lock); }
.fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .45s var(--ease), opacity .3s; }
.fold > div { overflow: hidden; min-height: 0; }
.fold.closed { grid-template-rows: 0fr; opacity: 0; }
.choices { display: flex; flex-direction: column; gap: 7px; padding-top: 9px; }
.choice { border: 1px solid var(--line); background: var(--glass-strong); border-radius: 14px; padding: 10px 14px; cursor: pointer; text-align: left; min-height: 44px; transition: transform .3s var(--spring); }
.choice:active { transform: scale(.96); }
.choice.rec { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: 0; font-weight: 700; }
.answered { display: inline-flex; margin-top: 6px; font-size: 11.5px; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft); animation: bubble-in .4s var(--spring) both; }
.cmd { display: block; font-family: var(--mono); font-size: 11px; background: var(--lock-soft); border-radius: 10px; padding: 6px 8px; margin: 6px 0; overflow-wrap: anywhere; }
.secret input { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; background: var(--glass); font-size: 16px; }
.btn { border: 1px solid var(--line); background: var(--glass-strong); border-radius: 12px; padding: 9px 14px; cursor: pointer; min-height: 42px; transition: transform .3s var(--spring); }
.btn:active { transform: scale(.96); }
.btn.lockb { background: var(--lock); border-color: var(--lock); color: #fff; font-weight: 700; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; color: #fff; font-weight: 700; }
.btn-row { display: flex; gap: 6px; margin-top: 7px; }
.btn-row .btn { flex: 1; }
.warn { display: flex; gap: 6px; font-size: 11.5px; color: var(--warn); margin-top: 7px; line-height: 1.5; }
.composer { position: absolute; left: 10px; right: 10px; bottom: 14px; display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 14px; border-radius: 24px;
  background: var(--glass-strong); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lift); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; padding: 8px 0; font-size: 16px; outline: none; max-height: 110px; }
.send { width: 38px; height: 38px; border: 0; border-radius: 50%; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-size: 17px; flex: none; cursor: pointer; transition: transform .35s var(--spring), opacity .2s; }
.send:disabled { opacity: .35; transform: scale(.9); }

/* ---------- bottom sheet ---------- */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 4; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; max-height: 80%; background: var(--glass-strong); border: 1px solid var(--glass-line); border-radius: 30px; box-shadow: var(--shadow-lift);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); transform: translateY(110%); transition: transform .55s var(--spring); z-index: 5; display: flex; flex-direction: column; }
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet-top { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px; flex: none; }
.sheet-top h3 { margin: 4px 0 0; font-size: 17px; }
.sheet-body { overflow-y: auto; padding: 4px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.acc { flex: none; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); overflow: hidden; }
.acc > button { width: 100%; border: 0; background: none; padding: 10px 14px; display: flex; justify-content: space-between; cursor: pointer; font-weight: 700; font-size: 13px; }
.acc > button .chev { transition: transform .35s var(--spring); color: var(--muted); }
.acc[data-open="true"] > button .chev { transform: rotate(90deg); }
.acc .fold > div > div { padding: 0 14px 12px; font-size: 13px; }
.acc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.acc li { background: var(--line); border-radius: 12px; padding: 7px 10px; }
.acc li small { display: block; color: var(--muted); font-size: 11px; }
.pc-only { color: var(--muted); font-size: 11.5px; margin: 6px 0 0; }

/* ---------- pairing ---------- */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px 22px 30px; text-align: center; }
.center h3 { margin: 0; font-size: 19px; }
.center p { margin: 0; color: var(--muted); font-size: 12.5px; }
.code { display: flex; gap: 6px; }
.code input { width: 34px; height: 46px; text-align: center; font-size: 20px; font-weight: 700; border: 1.5px solid var(--glass-line); border-radius: 12px; background: var(--glass-strong); box-shadow: var(--shadow); transition: transform .3s var(--spring), border-color .2s; }
.code input:focus { border-color: var(--accent); transform: translateY(-3px); outline: none; }
.notice { background: var(--glass-strong); border-radius: 16px; padding: 10px 12px; font-size: 11.5px; text-align: left; color: var(--ink); box-shadow: var(--shadow); display: flex; gap: 8px; }
.done-mark { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; color: #fff; background: linear-gradient(135deg, var(--work), #6ad9a8); animation: pop .6s var(--spring) both; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } }

/* ---------- lock screen ---------- */
.wall { background: linear-gradient(170deg, #9cc9ff, #ffb3c7 70%, #ffd38a); }
.wall::before, .wall::after { display: none; }
.wall .status { color: #fff; }
.clock { color: #fff; text-align: center; font-size: 60px; font-weight: 300; line-height: 1; margin-top: 34px; letter-spacing: -.02em; }
.date { color: #fff; text-align: center; font-size: 13px; margin-top: 6px; }
.notes { display: flex; flex-direction: column; gap: 8px; padding: 30px 10px; }
.note { background: rgba(255,255,255,.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #1d2433; border-radius: 20px; padding: 10px 12px;
  display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.12); animation: drop .6s var(--spring) both; animation-delay: calc(var(--i) * 400ms + 300ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-24px) scale(.92); } }
.note b { font-size: 12.5px; display: block; } .note span { font-size: 12px; } .note small { color: #55626d; font-size: 10.5px; float: right; }
.replay { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); border: 0; background: rgba(255,255,255,.6); border-radius: 99px; padding: 4px 12px; font-size: 11px; cursor: pointer; }

.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg-1); padding: 7px 14px; border-radius: 99px; font-size: 12px; z-index: 9; white-space: nowrap; animation: toast 2s var(--ease) both; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 14px) scale(.9); } 12%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
.typing { display: inline-flex; gap: 3px; } .typing i { width: 4px; height: 4px; border-radius: 50%; background: var(--work); animation: hop 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 30% { transform: translateY(-3px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation: none !important; transition: none !important; }
@media (max-width: 360px) { .phone { width: 100%; } }
</style>
</head>
<body>
<div class="intro">
  <h1>kantoku bot をスマホで</h1>
  <p>試作です。データは作りものです。外へは何も送りません。左の電話は押して動かせます(一覧 → 会話 → 名前を押すと下から情報)。</p>
  <div class="tools"><button id="motion">動きを止める</button><button id="theme">明るさを切り替え</button></div>
</div>

<div class="stage">
  <figure>
    <div class="phone" id="p1"><div class="status"><span>9:41</span><span>●●●</span></div><div class="views" id="v1"></div></div>
    <figcaption><b>1. 一覧と会話</b><br>一覧で選ぶと会話が横から入ってくる。‹ で戻る。名前を押すと情報が下からはね上がる。</figcaption>
  </figure>
  <figure>
    <div class="phone"><div class="status"><span>9:41</span><span>●●●</span></div><div class="views" id="v2"></div></div>
    <figcaption><b>2. 秘密の入力カード</b><br>スマホでも貼って登録できる。登録すると、PC の会話にも「my phone から登録しました」と残る。</figcaption>
  </figure>
  <figure>
    <div class="phone"><div class="status"><span>9:41</span><span>●●●</span></div><div class="views" id="v3"></div></div>
    <figcaption><b>3. はじめてつなぐとき</b><br>Tailscale を通して開き、PC に出た 6 けたを入れる。つないだ電話は、あなたとして答えられる。</figcaption>
  </figure>
  <figure>
    <div class="phone wall"><div class="status"><span></span><span>●●●</span></div>
      <div class="clock">9:41</div><div class="date">11月19日 木曜日</div>
      <div class="notes" id="notes"></div>
      <button class="replay" id="replay">もう一度</button>
    </div>
    <figcaption><b>4. 通知は 2 種類だけ</b><br>「あなた待ち」と「できました」。ファイルの文は出さない。押すとその会話が開く。</figcaption>
  </figure>
</div>

<script>
// Dummy data. In kantoku bot this comes from ~/.kantoku/<name>/ through the same JSON as the PC page.
const BOTS = [
  { name: "Mochi", color: "#ffb3c7", status: "waiting", say: "PR を出す前に見てほしいな",
    desc: "Web アプリの issue を進めて、PR を出すところまで面倒を見ます。", nots: ["本番への反映"],
    memory: [["main に merge すると自動で本番に出る", "11/12"]], routines: [["朝の見回り", "平日 8:44"]],
    talk: [
      { day: "11/18", t: "21:02", from: "bot", text: "検索の並び替え(#128)ができました。検証役も合格です。" },

// A secret card that works on the phone. It leaves a record on the PC and offers to clear the clipboard.

// ---------- phone 1: list → chat → sheet ----------
const v1 = document.getElementById("v1"), p1 = document.getElementById("p1");
let filter = "all";
function listView() {
  const v = el("div", "view");
  const top = el("div", "top"), conn = el("span", "conn"); conn.append(el("span", "live"), "家の PC"); top.append(el("h2", null, "Bots"), conn);
  const seg = el("div", "seg"), thumb = el("span", "thumb"); seg.append(thumb);

    BOTS.filter(b => filter === "all" || (filter === "wait" ? b.status === "waiting" : b.status === "working")).sort((a, c) => order[a.status] - order[c.status]).forEach((b, k) => {

function chatView(b) {
