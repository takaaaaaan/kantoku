<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kantoku bot mobile</title>
<!-- Mockup only. All data below is made up. No external loads. Nothing is sent anywhere.
     kantoku bot on a phone: one bot list and a conversation as two sliding screens, a bottom sheet
     for info, a secret card that works on the phone, pairing, and lock-screen notifications. -->
<style>
:root {
  --bg: #f4f5f8; --blob-a: #ffd9e4; --blob-b: #d6e6ff;
  --surface: #ffffff; --surface-2: #f6f7fa; --surface-glass: rgba(255,255,255,.78);
  --border: #e6e8ef; --border-strong: #cfd4e0; --text: #15192a; --text-2: #3a4258; --muted: #727b90; --primary: #15192a;
  --accent: #ff6a3d; --accent-2: #ff3d7f; --accent-soft: color-mix(in srgb, #ff6a3d 12%, transparent);
  --ok: #1a9e6a; --warn: #b9740a; --lock: #7c5cff; --lock-soft: color-mix(in srgb, #7c5cff 12%, transparent);
  --mine: linear-gradient(135deg, #3e63dd, #7c5cff);
  --e1: 0 1px 2px rgba(21,25,42,.05), 0 4px 14px -6px rgba(21,25,42,.10); --e2: 0 2px 4px rgba(21,25,42,.06), 0 14px 32px -12px rgba(21,25,42,.22); --e3: 0 30px 70px -20px rgba(21,25,42,.35);
  --r-sm: 10px; --r: 16px; --r-lg: 24px; --r-xl: 32px; --stage: #e8ebf1;
  --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --blob-a: #4a1d36; --blob-b: #1a2f5c; --surface: #141a2e; --surface-2: #1a2139; --surface-glass: rgba(20,26,46,.78);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16); --text: #eef1f8; --text-2: #c4cbe0; --muted: #8b95ae; --primary: #eef1f8; --warn: #fbbf24;
  --e1: 0 0 0 1px rgba(255,255,255,.04); --e2: 0 16px 40px -14px rgba(0,0,0,.6); --e3: 0 30px 80px -20px rgba(0,0,0,.7); --stage: #070a14; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1020; --blob-a: #4a1d36; --blob-b: #1a2f5c; --surface: #141a2e; --surface-2: #1a2139; --surface-glass: rgba(20,26,46,.78);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16); --text: #eef1f8; --text-2: #c4cbe0; --muted: #8b95ae; --primary: #eef1f8; --warn: #fbbf24;
  --e1: 0 0 0 1px rgba(255,255,255,.04); --e2: 0 16px 40px -14px rgba(0,0,0,.6); --e3: 0 30px 80px -20px rgba(0,0,0,.7); --stage: #070a14; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--stage); color: var(--text); font: 14px/1.5 var(--font); letter-spacing: -.01em; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- review page (not part of the app) ---------- */
.intro { max-width: 1280px; margin: 0 auto; padding: 24px 16px 4px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.intro h1 { font-size: 22px; font-weight: 800; letter-spacing: -.03em; margin: 0; }
.intro p { margin: 0; color: var(--muted); font-size: 13px; flex: 1 1 320px; }
.tools { display: flex; gap: 4px; }
.tools button { height: 28px; padding: 0 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 12px; }
.stage { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; padding: 24px 16px 48px; }
figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
figcaption { font-size: 13px; color: var(--muted); max-width: 296px; text-align: center; }
figcaption b { color: var(--text); }

/* ---------- phone ---------- */
.phone { width: 300px; height: 640px; border-radius: 44px; position: relative; overflow: hidden; isolation: isolate; background: var(--bg); box-shadow: 0 0 0 10px #0d1117, var(--e3); }
.phone::before, .phone::after { content: ""; position: absolute; width: 240px; height: 240px; border-radius: 50%; filter: blur(60px); opacity: .85; z-index: -1; animation: drift 24s var(--ease) infinite alternate; }
.phone::before { background: var(--blob-a); left: -90px; top: -70px; } .phone::after { background: var(--blob-b); right: -100px; bottom: 40px; animation-delay: -9s; }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.12); } }
.sbar { height: 36px; display: flex; justify-content: space-between; align-items: center; padding: 8px 28px 0; font-size: 12px; font-weight: 700; }
.views { position: absolute; inset: 36px 0 0; overflow: hidden; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform .35s var(--ease), opacity .25s; }
.view.behind { transform: translateX(-28%); opacity: 0; pointer-events: none; }
.view.ahead { transform: translateX(100%); }

/* ---------- avatar ---------- */
.av { position: relative; width: 48px; height: 48px; flex: none; display: block; }
.av svg { width: 100%; height: 100%; display: block; overflow: visible; }
.av .eyes { animation: blink 6s infinite; animation-delay: var(--blink, 0s); }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.av::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; opacity: 0; pointer-events: none; }
.av.working::before { opacity: 1; background: conic-gradient(var(--ok), transparent 60%); animation: spin 1.4s linear infinite; -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%); mask: radial-gradient(circle, transparent 64%, #000 66%); }
.av.waiting::before { opacity: 1; background: radial-gradient(circle, transparent 60%, color-mix(in srgb, var(--accent) 45%, transparent) 64%, transparent 72%); animation: halo 2.4s var(--ease) infinite; }
.av.asleep svg { filter: saturate(.55); opacity: .85; }
.av .st { position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%; border: 3px solid var(--surface); background: var(--muted); }
.av.working .st { background: var(--ok); } .av.waiting .st { background: var(--accent); }
@keyframes spin { to { transform: rotate(1turn); } } @keyframes halo { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.3); opacity: 0; } }
.av.s { width: 32px; height: 32px; } .av.s .st { display: none; } .av.xl { width: 88px; height: 88px; } .av.xl .st { display: none; }

/* ---------- list ---------- */
.top { padding: 8px 20px 8px; display: flex; align-items: center; justify-content: space-between; }
.top h2 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; margin: 0; }
.conn { display: inline-flex; gap: 8px; align-items: center; height: 28px; padding: 0 12px; font-size: 12px; color: var(--text-2); background: var(--surface); border-radius: 99px; box-shadow: var(--e1); }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.list { list-style: none; margin: 0; padding: 4px 12px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
.list li { animation: rise .35s var(--ease) both; animation-delay: calc(min(var(--i), 12) * 50ms + 100ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
.row { width: 100%; min-height: 72px; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; background: var(--surface-glass); border: 1px solid var(--border);
  border-radius: var(--r-lg); text-align: left; box-shadow: var(--e1); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .2s var(--spring); }
.row:active { transform: scale(.97); }
.row .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .l { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 700; color: #fff; white-space: nowrap;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 14px -6px var(--accent-2); }
.badge.lock { background: var(--lock); box-shadow: 0 6px 14px -6px var(--lock); }

/* ---------- conversation ---------- */
.bar { display: flex; align-items: center; gap: 8px; padding: 4px 12px 8px; }
.back { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); box-shadow: var(--e1); display: grid; place-items: center; flex: none; transition: transform .2s var(--spring); }
.back:active { transform: scale(.94); }
.head-name { display: flex; align-items: center; gap: 8px; text-align: left; min-width: 0; padding: 4px 8px 4px 4px; border-radius: 99px; }
.head-name strong { display: block; font-size: 16px; line-height: 1.2; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); } .status.working i { background: var(--ok); } .status.waiting i { background: var(--accent); }
.chat { flex: 1; overflow-y: auto; padding: 8px 12px 96px; display: flex; flex-direction: column; gap: 12px; }
.day { align-self: center; color: var(--muted); font-size: 12px; height: 24px; padding: 0 12px; display: grid; place-items: center; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
.msg { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; animation: rise .35s var(--ease) both; animation-delay: calc(min(var(--i, 0), 12) * 50ms + 150ms); }
.msg.mine { grid-template-columns: 1fr; align-self: flex-end; max-width: 85%; }
.bubble { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 6px 20px 20px 20px; padding: 12px; box-shadow: var(--e1); min-width: 0; overflow-wrap: anywhere; }
.mine .bubble { background: var(--mine); color: #fff; border: 0; border-radius: 20px 6px 20px 20px; }
.bubble time { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; } .mine .bubble time { color: rgba(255,255,255,.8); }
.tag { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; } .tag .ico { width: 14px; height: 14px; }
.ask, .secret { border-color: transparent; }
.ask::before, .secret::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none; background: linear-gradient(135deg, var(--accent), var(--accent-2), #ffc46b);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.secret::before { background: linear-gradient(135deg, var(--lock), #b39cff); } .secret .tag { color: var(--lock); }
.fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s var(--ease), opacity .2s; } .fold > div { overflow: hidden; min-height: 0; } .fold.closed { grid-template-rows: 0fr; opacity: 0; }
.choices { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.choice { min-height: 44px; padding: 0 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); text-align: left; transition: transform .2s var(--spring); }
.choice:active { transform: scale(.97); }
.choice.rec { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; color: #fff; font-weight: 700; }
.chip-done { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; margin-top: 8px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); animation: pop .3s var(--spring) both; }
.chip-done .ico { width: 14px; height: 14px; }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
.cmd { display: block; font-family: var(--mono); font-size: 12px; letter-spacing: 0; background: var(--lock-soft); border-radius: var(--r-sm); padding: 8px; margin: 8px 0; overflow-wrap: anywhere; }
.input { width: 100%; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-size: 16px; outline: 0; }
.input:focus { border-color: var(--lock); box-shadow: 0 0 0 3px var(--lock-soft); }
.btn { min-height: 44px; padding: 0 16px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; white-space: nowrap; transition: transform .2s var(--spring); }
.btn:active:not(:disabled) { transform: scale(.96); } .btn:disabled { opacity: .5; }
.btn-lock { background: var(--lock); color: #fff; width: 100%; margin-top: 8px; }
.btn-ghost { background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
.btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 8px 18px -8px var(--accent-2); }
.warn { display: flex; gap: 8px; font-size: 12px; color: var(--warn); margin-top: 8px; line-height: 1.5; } .warn .ico { width: 16px; height: 16px; margin-top: 1px; }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.composer { position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 16px; border-radius: var(--r-lg);
  background: var(--surface-glass); border: 1px solid var(--border); box-shadow: var(--e2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; padding: 8px 0; font-size: 16px; outline: none; max-height: 112px; }
.send { width: 40px; height: 40px; border-radius: 50%; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; flex: none; transition: transform .25s var(--spring), opacity .15s; }
.send:disabled { opacity: .35; transform: scale(.9); }

/* ---------- bottom sheet ---------- */
.scrim { position: absolute; inset: 0; background: rgba(12,16,32,.3); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 4; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; max-height: 82%; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--e3); z-index: 5; display: flex; flex-direction: column;
  transform: translateY(110%); transition: transform .35s var(--spring); }
.sheet.open { transform: none; }
.grab { width: 40px; height: 4px; border-radius: 99px; background: var(--border-strong); margin: 8px auto 0; flex: none; }
.sheet-top { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px 12px; flex: none; }
.sheet-top h3 { margin: 4px 0 0; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.sheet-body { overflow-y: auto; padding: 0 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.acc { flex: none; border-radius: var(--r); background: var(--surface-2); overflow: hidden; }
.acc > button { width: 100%; height: 44px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; }
.acc > button .ico { transition: transform .25s var(--spring); color: var(--muted); } .acc[data-open="true"] > button .ico { transform: rotate(90deg); }
.acc .fold > div > div { padding: 0 16px 12px; font-size: 13px; }
.acc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.acc li { background: var(--surface); border-radius: var(--r-sm); padding: 8px 12px; } .acc li small { display: block; color: var(--muted); font-size: 12px; }

/* ---------- pairing ---------- */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px 24px 32px; text-align: center; }
.center h3 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.center p { margin: 0; color: var(--muted); font-size: 13px; }
.code { display: flex; gap: 8px; }
.code input { width: 36px; height: 48px; text-align: center; font-size: 20px; font-weight: 700; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--e1); transition: transform .2s var(--spring), border-color .15s; }
.code input:focus { border-color: var(--accent); transform: translateY(-3px); outline: none; }
.notice { background: var(--surface); border-radius: var(--r); padding: 12px; font-size: 12px; text-align: left; box-shadow: var(--e1); display: flex; gap: 8px; color: var(--text-2); }
.notice .ico { color: var(--warn); width: 16px; height: 16px; margin-top: 1px; }
.done-mark { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--ok), #6ad9a8); animation: pop .35s var(--spring) both; }
.done-mark .ico { width: 40px; height: 40px; stroke-width: 2.6; }

/* ---------- lock screen ---------- */
.wall { background: linear-gradient(170deg, #9cc9ff, #ffb3c7 70%, #ffd38a); } .wall::before, .wall::after { display: none; } .wall .sbar { color: #fff; }
.clock { color: #fff; text-align: center; font-size: 64px; font-weight: 300; line-height: 1; margin-top: 32px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.date { color: #fff; text-align: center; font-size: 13px; margin-top: 8px; }
.notes { display: flex; flex-direction: column; gap: 8px; padding: 32px 12px; }
.note-card { background: rgba(255,255,255,.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); color: #15192a; border-radius: 20px; padding: 12px; display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center;
  box-shadow: 0 8px 20px rgba(0,0,0,.12); text-align: left; width: 100%; animation: drop .4s var(--spring) both; animation-delay: calc(var(--i) * 300ms + 200ms); }
@keyframes drop { from { opacity: 0; transform: translateY(-24px) scale(.94); } }
.note-card b { font-size: 13px; display: block; } .note-card span { font-size: 12px; } .note-card small { color: #55626d; font-size: 12px; float: right; }
.replay { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); height: 28px; padding: 0 12px; border-radius: 99px; background: rgba(255,255,255,.6); font-size: 12px; }
.toast { position: absolute; left: 50%; bottom: 88px; transform: translateX(-50%); display: inline-flex; gap: 8px; align-items: center; background: var(--primary); color: var(--bg); height: 36px; padding: 0 16px; border-radius: 99px;
  font-size: 12px; font-weight: 600; z-index: 9; white-space: nowrap; animation: toast 2.6s var(--ease) both; }
.toast .ico { width: 14px; height: 14px; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 14px) scale(.94); } 10%, 88% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
.dots { display: inline-flex; gap: 4px; } .dots b { width: 4px; height: 4px; border-radius: 50%; background: var(--ok); animation: hop 1.2s infinite; }
.dots b:nth-child(2) { animation-delay: .15s; } .dots b:nth-child(3) { animation-delay: .3s; } @keyframes hop { 30% { transform: translateY(-3px); } }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
@media (max-width: 360px) { .phone { width: 100%; } }
</style>
</head>
<body>
<div class="intro">
  <h1>kantoku bot をスマホで</h1>
  <p>試作です。データは作りものです。外へは何も送りません。左の電話は押して動かせます(一覧 → 会話 → 名前を押すと下から情報)。</p>
  <div class="tools"><button id="motion">動きを止める</button><button id="theme">明るさ</button></div>
</div>
<div class="stage">
  <figure><div class="phone"><div class="sbar"><span>9:41</span><span>●●●</span></div><div class="views" id="v1"></div></div>
    <figcaption><b>1. 一覧と会話</b><br>Bot ごとに形と色が違う。選ぶと会話が横から入り、名前を押すと情報が下から出る。</figcaption></figure>
  <figure><div class="phone"><div class="sbar"><span>9:41</span><span>●●●</span></div><div class="views" id="v2"></div></div>
    <figcaption><b>2. 秘密の入力カード</b><br>スマホでも貼って登録できる。登録すると PC の会話に「my phone から登録しました」と残る。</figcaption></figure>
  <figure><div class="phone"><div class="sbar"><span>9:41</span><span>●●●</span></div><div class="views" id="v3"></div></div>
    <figcaption><b>3. はじめてつなぐとき</b><br>PC に出た 6 けたを入れる。つないだ電話は、あなたとして答えられる。</figcaption></figure>
  <figure><div class="phone wall"><div class="sbar"><span></span><span>●●●</span></div><div class="clock">9:41</div><div class="date">11月19日 木曜日</div><div class="notes" id="notes"></div><button class="replay" id="replay">もう一度</button></div>
    <figcaption><b>4. 通知は 2 種類だけ</b><br>「あなた待ち」と「できました」。その Bot の顔で届く。ファイルの文は出さない。</figcaption></figure>
</div>

<script>
const ICONS = { chev: "m9 18 6-6-6-6", back: "m15 18-6-6 6-6", up: "M12 19V5M5 12l7-7 7 7", lock: "M7 11V7a5 5 0 0 1 10 0v4M5 11h14v10H5z",
  spark: "M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z", check: "M20 6 9 17l-5-5", alert: "M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01" };
const NS = "http://www.w3.org/2000/svg";
function ico(name) { const s = document.createElementNS(NS, "svg"); s.setAttribute("class", "ico"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("aria-hidden", "true"); const p = document.createElementNS(NS, "path"); p.setAttribute("d", ICONS[name]); s.append(p); return s; }

// Same avatar set as the desktop mockup: 13 shapes x 11 colors, two tall white eyes.
const COLORS = { black: "#26262b", brown: "#8d5b3c", red: "#e5484d", orange: "#f76b15", amber: "#ffb224", green: "#30a46c", teal: "#12a594", blue: "#3e63dd", purple: "#8e4ec6", pink: "#e93d82", gray: "#8b8d98" };
function poly(n, rOut, rIn, cy) { const pts = [], k = rIn ? n * 2 : n; for (let i = 0; i < k; i++) { const r = rIn && i % 2 ? rIn : rOut, a = -Math.PI / 2 + i * Math.PI * 2 / k; pts.push((50 + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1)); } return pts.join(" "); }
const SHAPES = {
  circle: { eyes: 48, svg: '<circle cx="50" cy="50" r="44"/>' }, square: { eyes: 48, svg: '<rect x="8" y="8" width="84" height="84" rx="26"/>' },
  capsule: { eyes: 44, svg: '<rect x="22" y="4" width="56" height="92" rx="28"/>' }, diamond: { eyes: 50, svg: '<rect x="20" y="20" width="60" height="60" rx="14" transform="rotate(45 50 50)"/>' },
  triangle: { eyes: 62, svg: '<polygon points="50,16 88,82 12,82" stroke="currentColor" stroke-width="16" stroke-linejoin="round"/>' },
  star: { eyes: 54, svg: '<polygon points="' + poly(5, 40, 20, 54) + '" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>' },
  flower: { eyes: 50, svg: [0, 1, 2, 3, 4].map(i => { const a = -Math.PI / 2 + i * Math.PI * 2 / 5; return '<circle cx="' + (50 + 26 * Math.cos(a)).toFixed(1) + '" cy="' + (52 + 26 * Math.sin(a)).toFixed(1) + '" r="22"/>'; }).join("") + '<circle cx="50" cy="52" r="26"/>' },
  clover: { eyes: 50, svg: '<circle cx="31" cy="31" r="23"/><circle cx="69" cy="31" r="23"/><circle cx="31" cy="69" r="23"/><circle cx="69" cy="69" r="23"/><circle cx="50" cy="50" r="26"/>' },
  cloud: { eyes: 58, svg: '<circle cx="30" cy="60" r="22"/><circle cx="52" cy="42" r="28"/><circle cx="74" cy="60" r="20"/><rect x="18" y="56" width="66" height="26" rx="13"/>' },
  drop: { eyes: 64, svg: '<path d="M50 6C50 6 84 42 84 63a34 34 0 0 1-68 0C16 42 50 6 50 6z"/>' },
  hexagon: { eyes: 50, svg: '<polygon points="' + poly(6, 38, 0, 50) + '" stroke="currentColor" stroke-width="14" stroke-linejoin="round"/>' },
  heart: { eyes: 46, svg: '<path d="M50 88C20 66 6 50 6 32 6 18 17 8 30 8c9 0 16 5 20 12 4-7 11-12 20-12 13 0 24 10 24 24 0 18-14 34-44 56z"/>' },
  egg: { eyes: 54, svg: '<ellipse cx="50" cy="52" rx="38" ry="44"/>' },
};
function hash(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }
function avatar(bot, size, status) {
  const shape = SHAPES[bot.shape], st = status === undefined ? bot.status : status;
  const span = document.createElement("span"); span.className = "av" + (st ? " " + st : "") + (size ? " " + size : ""); span.setAttribute("aria-hidden", "true"); span.style.setProperty("--blink", (hash(bot.name) % 50) / 10 + "s");
  const y = shape.eyes, eyes = st === "asleep" ? '<path d="M35 ' + y + 'q5 4 10 0M55 ' + y + 'q5 4 10 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>'
    : '<g class="eyes" style="transform-origin:50px ' + y + 'px"><ellipse cx="40" cy="' + y + '" rx="5.5" ry="9.5" fill="#fff"/><ellipse cx="60" cy="' + y + '" rx="5.5" ry="9.5" fill="#fff"/></g>';
  span.innerHTML = '<svg viewBox="0 0 100 100" style="color:' + COLORS[bot.color] + '"><g fill="currentColor">' + shape.svg + '</g>' + eyes + '</svg>';
  if (st) span.append(Object.assign(document.createElement("span"), { className: "st" })); return span;
}

const BOTS = [
  { name: "Mochi", shape: "cloud", color: "pink", status: "waiting", line: "PR を出す前に見てほしいな", desc: "Web アプリの issue を進めて、PR を出すところまで面倒を見ます。", nots: ["本番への反映"],
    memory: [["main に merge すると自動で本番に出る", "11/12"]], routines: [["朝の見回り", "平日 8:44"]],
    talk: [{ day: "11/18", t: "21:02", from: "bot", text: "検索の並び替え(#128)ができました。検証役も合格です。" }, { day: "11/18", t: "21:20", from: "me", text: "ありがとう。初期値は新しい順に", sent: "届けました" },
      { day: "11/19", t: "9:40", from: "bot", ask: true, text: "PR を出す前に、どこで試しますか?", choices: [["手元で試す", true], ["ステージングで試す", false], ["試さずに出す", false]] }] },
  { name: "Pico", shape: "star", color: "amber", status: "waiting", line: "秘密を 1 つ登録してほしい", secretWait: true, desc: "kantoku そのものを良くする係です。", nots: ["LICENSE の変更"], memory: [], routines: [],
    talk: [{ day: "11/19", t: "9:20", from: "bot", text: "CI に Vercel の鍵が要ります。カードを出しました。" }] },
  { name: "Kumo", shape: "drop", color: "blue", status: "working", line: "テストを直しているところ", desc: "データの整理を手伝います。", nots: [], memory: [], routines: [], talk: [{ day: "11/19", t: "9:29", from: "bot", text: "テストの直しを始めました。" }] },
  { name: "Hana", shape: "flower", color: "purple", status: "working", line: "週報の下書きを作っています", desc: "毎週の報告をまとめます。", nots: [], memory: [], routines: [], talk: [{ day: "11/19", t: "9:10", from: "bot", text: "今週の PR を 12 件集めました。" }] },
  { name: "Clover", shape: "clover", color: "green", status: "working", line: "依存関係の更新を確かめています", desc: "ライブラリの更新を見張ります。", nots: [], memory: [], routines: [], talk: [{ day: "11/19", t: "7:31", from: "bot", text: "更新が 3 件あります。" }] },
  { name: "Sora", shape: "egg", color: "teal", status: "asleep", line: "おやすみ中", desc: "共有ドライブの整理を手伝います。", nots: [], memory: [], routines: [], talk: [{ day: "11/16", t: "16:40", from: "bot", text: "棚卸しが終わりました。" }] },
];
const STATUS = { working: "作業中", waiting: "あなた待ち", asleep: "おやすみ中" };
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.dataset.motion === "off";
const later = (fn, ms) => setTimeout(fn, reduce() ? 0 : ms);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function status(b) { const s = el("span", "status " + b.status); s.append(el("i"), STATUS[b.status]); if (b.status === "working") { const d = el("span", "dots"); d.append(el("b"), el("b"), el("b")); s.append(d); } return s; }
function toast(host, text) { const t = el("div", "toast"); t.setAttribute("role", "status"); t.append(ico("check"), text); host.append(t); setTimeout(() => t.remove(), 2700); }
function now() { const d = new Date(); return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0"); }
function accordion(title, open, body) {
  const box = el("div", "acc"); box.dataset.open = open; const head = el("button"); head.setAttribute("aria-expanded", open); head.append(el("span", null, title), ico("chev"));
  const fold = el("div", "fold" + (open ? "" : " closed")), inner = el("div"), pad = el("div"); pad.append(...body); inner.append(pad); fold.append(inner);
  head.onclick = () => { const o = box.dataset.open !== "true"; box.dataset.open = o; head.setAttribute("aria-expanded", o); fold.classList.toggle("closed", !o); }; box.append(head, fold); return box;
}
function ul(items) { const u = el("ul"); (items.length ? items : [["まだありません", ""]]).forEach(([a, b]) => { const li = el("li", null, a); if (b) li.append(el("small", null, b)); u.append(li); }); return u; }

// A secret card that works on the phone: clipboard warning, a record on the PC, and a one-press clipboard clear.
function secretCard(host, b, onDone) {
  const m = el("div", "msg"), bub = el("div", "bubble secret"), tag = el("span", "tag"); tag.append(ico("lock"), "秘密を登録してほしい");
  bub.append(tag, el("span", null, "Vercel token"), el("code", "cmd", "gh secret set VERCEL_TOKEN --repo example-org/web"));
  const fold = el("div", "fold"), inner = el("div"), form = el("form");
  const inp = el("input", "input"); inp.type = "password"; inp.placeholder = "値を貼る"; inp.autocomplete = "off"; inp.setAttribute("autocapitalize", "off"); inp.spellcheck = false; inp.setAttribute("aria-label", "秘密の値");
  const go = el("button", "btn btn-lock", "登録"); go.type = "submit";
  const warn = el("div", "warn"); warn.append(ico("alert"), el("span", null, "スマホのクリップボードは、ほかのアプリやキーボードの履歴に残ることがあります。登録のあと消してください。"));
  form.append(inp, go, warn); inner.append(form); fold.append(inner); const time = el("time", null, "9:21 ・ あと 28 分"); bub.append(fold, time);
  form.onsubmit = e => { e.preventDefault(); if (!inp.value) { inp.focus(); return; } go.disabled = true; go.textContent = "登録中…"; inp.value = "";
    later(() => { fold.classList.add("closed"); later(() => {
      const ok = el("div"), chip = el("span", "chip-done"); chip.append(ico("check"), "登録しました(exit 0)");
      const clear = el("button", "btn btn-ghost", "クリップボードを空にする"); clear.style.cssText = "width:100%;margin-top:8px";
      clear.onclick = () => { navigator.clipboard?.writeText("").catch(() => {}); clear.disabled = true; clear.textContent = "空にしました"; toast(host, "クリップボードを空にしました"); };
      ok.append(chip, el("p", "note", "PC の会話にも「my phone から登録しました」と残ります。"), clear); bub.insertBefore(ok, time); onDone && onDone(); }, 300); }, 500); };
  m.append(avatar(b, "s", null), bub); return m;
}

// ---------- phone 1 ----------
const v1 = document.getElementById("v1"), p1 = v1.parentElement;
function listView() {
  const v = el("div", "view"), top = el("div", "top"), conn = el("span", "conn"); conn.append(el("span", "live"), "家の PC"); top.append(el("h2", null, "Bots"), conn);
  const list = el("ul", "list"), order = { waiting: 0, working: 1, asleep: 2 };
  [...BOTS].sort((a, c) => order[a.status] - order[c.status]).forEach((b, k) => {
    const li = el("li"); li.style.setProperty("--i", k); const row = el("button", "row"), mid = el("div"); mid.style.minWidth = "0"; mid.append(el("div", "n", b.name), el("div", "l", b.line));
    row.append(avatar(b), mid, b.secretWait ? el("span", "badge lock", "秘密") : b.status === "waiting" ? el("span", "badge", "あなた待ち") : el("span")); row.onclick = () => open(b); li.append(row); list.append(li);
  });
  v.append(top, list); return v;
}
function chatView(b) {
  const v = el("div", "view ahead"), bar = el("div", "bar"), back = el("button", "back"); back.setAttribute("aria-label", "一覧へ戻る"); back.append(ico("back")); back.onclick = close;
  const hn = el("button", "head-name"), txt = el("span"); txt.append(el("strong", null, b.name), status(b)); hn.append(avatar(b, "s"), txt); hn.onclick = () => sheet(true); bar.append(back, hn);
  const chat = el("section", "chat"); let day = "";
  b.talk.forEach((item, k) => {
    if (item.day !== day) { chat.append(el("div", "day", item.day)); day = item.day; }
    if (item.from === "me") { const m = el("div", "msg mine"), bub = el("div", "bubble"); m.style.setProperty("--i", k); bub.append(el("span", null, item.text), el("time", null, item.t + " ・ " + item.sent)); m.append(bub); chat.append(m); return; }
    const m = el("div", "msg"); m.style.setProperty("--i", k); const bub = el("div", "bubble" + (item.ask ? " ask" : ""));
    if (item.ask) { const t = el("span", "tag"); t.append(ico("spark"), "あなたに聞きたいこと"); bub.append(t); }
    bub.append(el("span", null, item.text));
    if (item.ask) {
      const fold = el("div", "fold" + (item.answered ? " closed" : "")), inner = el("div"), col = el("div", "choices");
      item.choices.forEach(([label, rec]) => { const c = el("button", "choice" + (rec ? " rec" : ""), label + (rec ? "(おすすめ)" : ""));
        c.onclick = () => { item.answered = label; fold.classList.add("closed"); later(() => { b.talk.push({ day: "11/19", t: now(), from: "me", text: label, sent: "届けました" }); b.status = "working"; b.line = "続きから作業中"; reopen(b); toast(p1, "答えを " + b.name + " に届けました"); }, 300); }; col.append(c); });
      const own = el("button", "choice", "自分で書く"); own.onclick = () => { const t = v.querySelector("textarea"); t.placeholder = "答えを書く…"; t.focus(); }; col.append(own);
      inner.append(col); fold.append(inner); bub.append(fold);
    }
    bub.append(el("time", null, item.t)); m.append(avatar(b, "s", null), bub); chat.append(m);
  });
  if (b.secretWait) chat.append(secretCard(p1, b, () => { b.secretWait = false; b.status = "working"; b.line = "続きから作業中"; }));
  const form = el("form", "composer"), ta = el("textarea"); ta.rows = 1; ta.placeholder = b.name + " に話しかける…"; ta.setAttribute("aria-label", "メッセージ");
  const send = el("button", "send"); send.type = "submit"; send.disabled = true; send.setAttribute("aria-label", "送る"); send.append(ico("up"));
  ta.oninput = () => { send.disabled = !ta.value.trim(); ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };
  form.onsubmit = e => { e.preventDefault(); const text = ta.value.trim(); if (!text) return; const asleep = b.status === "asleep"; b.talk.push({ day: "11/19", t: now(), from: "me", text, sent: asleep ? "起きたら読みます" : "届けました" }); reopen(b); toast(p1, asleep ? "起きたら読みます" : "届けました"); };
  form.append(ta, send);
  const scrim = el("div", "scrim"), sh = el("div", "sheet"); sh.setAttribute("role", "dialog"); sh.setAttribute("aria-label", b.name + " の情報"); scrim.onclick = () => sheet(false);
  const st = el("div", "sheet-top"); st.append(avatar(b, "xl"), el("h3", null, b.name), status(b));
  const body = el("div", "sheet-body");
  body.append(accordion("説明", true, [el("span", null, b.desc), el("p", "note", "やらないこと: " + (b.nots.join("、") || "なし"))]), accordion("覚えていること", false, [ul(b.memory.map(([f, d]) => [f, d + " に覚えた"]))]),
    accordion("ルーティン", false, [ul(b.routines)]), el("p", "note", "説明・覚えていること・見た目を直すのは PC の画面で。"));
  sh.append(el("div", "grab"), st, body); v.append(bar, chat, form, scrim, sh);
  requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; }); return v;
}
let list1 = listView(), chat1 = null; v1.append(list1);
function open(b) { chat1 = chatView(b); v1.append(chat1); requestAnimationFrame(() => requestAnimationFrame(() => { chat1.classList.remove("ahead"); list1.classList.add("behind"); })); }
function close() { const c = chat1; c.classList.add("ahead"); const fresh = listView(); fresh.classList.add("behind"); list1.replaceWith(fresh); list1 = fresh; requestAnimationFrame(() => list1.classList.remove("behind")); later(() => c.remove(), 350); }
function reopen(b) { const c = chatView(b); c.classList.remove("ahead"); chat1.replaceWith(c); chat1 = c; }
function sheet(on) { chat1.querySelector(".sheet").classList.toggle("open", on); chat1.querySelector(".scrim").classList.toggle("open", on); }
document.addEventListener("keydown", e => { if (e.key === "Escape" && chat1) sheet(false); });

// ---------- phone 2: secret card ----------
(function () {
  // A still of one conversation, so it has no back button (nothing on it is decoration).
  const v2 = document.getElementById("v2"), b = { ...BOTS[1] }, v = el("div", "view"), bar = el("div", "bar"), hn = el("span", "head-name"), txt = el("span");
  txt.append(el("strong", null, b.name), status(b)); hn.append(avatar(b, "s"), txt); bar.append(hn);
  const chat = el("section", "chat"), m = el("div", "msg"), bub = el("div", "bubble"); bub.append(el("span", null, "CI に Vercel の鍵が要ります。カードを出しました。"), el("time", null, "9:20")); m.append(avatar(b, "s", null), bub);
  chat.append(el("div", "day", "11/19"), m, secretCard(v2.parentElement, b)); v.append(bar, chat); v2.append(v);
})();

// ---------- phone 3: pairing ----------
(function () {
  const v3 = document.getElementById("v3"), v = el("div", "view"), c = el("div", "center"), code = el("div", "code"); code.setAttribute("role", "group"); code.setAttribute("aria-label", "6 けたの数字");
  const boxes = [...Array(6)].map((_, i) => { const x = el("input"); x.inputMode = "numeric"; x.maxLength = 1; x.setAttribute("aria-label", (i + 1) + " けため"); x.value = i < 4 ? "4829"[i] : "";
    x.oninput = () => { if (x.value && boxes[i + 1]) boxes[i + 1].focus(); go.disabled = boxes.some(y => !y.value); }; code.append(x); return x; });
  const notice = el("div", "notice"); notice.append(ico("alert"), el("span", null, "つないだ電話は、あなたとして答え・話しかけ・秘密の登録までできます。なくしたらすぐ、PC の「つないだ電話」か Tailscale の管理画面で外してください。"));
  const go = el("button", "btn btn-accent", "つなぐ"); go.style.width = "100%"; go.disabled = true;
  go.onclick = () => { c.textContent = ""; const mark = el("div", "done-mark"); mark.append(ico("check")); c.append(mark, el("h3", null, "つながりました"), el("p", null, "この電話の名前: my phone"), el("p", null, "PC の「つないだ電話」に出ています。")); };
  c.append(avatar({ name: "kantoku", shape: "cloud", color: "pink" }, "xl", null), el("h3", null, "この電話をつなぐ"), el("p", null, "PC の kantoku bot で「電話をつなぐ」を押すと、6 けたの数字が出ます。10 分だけ使えます。"), code, notice, go);
  v.append(c); v3.append(v);
})();

// ---------- phone 4: lock screen ----------
function notes() {
  const n = document.getElementById("notes"); n.textContent = "";
  [[BOTS[0], "いま", "Mochi があなた待ち", "開いて答えてください"], [BOTS[2], "12分前", "Kumo の仕事ができました", "開いて見てください"]].forEach(([b, t, title, body], i) => {
    const d = el("button", "note-card"); d.style.setProperty("--i", i); const tx = el("div"); tx.append(el("small", null, t), el("b", null, title), el("span", null, body)); d.append(avatar(b, null, null), tx);
    d.onclick = () => { open(b); p1.scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: "center" }); }; n.append(d);
  });
}
notes(); document.getElementById("replay").onclick = notes;
document.getElementById("motion").onclick = e => { const off = document.documentElement.dataset.motion !== "off"; document.documentElement.dataset.motion = off ? "off" : "on"; e.target.textContent = off ? "動きをもどす" : "動きを止める"; };
document.getElementById("theme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };
</script>
