<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kantoku bot desktop</title>
<!-- Mockup only. All data below is made up. No external loads. Nothing is sent anywhere.
     The installed desktop app: one bot list, one conversation, a "new bot" dialog where each
     manager gets its own shape and color, an info panel, phones, and an OS notification preview. -->
<style>
/* ---------- tokens (4px spacing; radius 10 / 16 / 24 / 32; elevation 0-3) ---------- */
:root {
  --bg: #f4f5f8; --bg-blob-a: #ffd9e4; --bg-blob-b: #d6e6ff; --bg-blob-c: #ffeccc;
  --surface: #ffffff; --surface-2: #f6f7fa; --surface-glass: rgba(255,255,255,.72);
  --border: #e6e8ef; --border-strong: #cfd4e0;
  --text: #15192a; --text-2: #3a4258; --muted: #727b90;
  --primary: #15192a; --accent: #ff6a3d; --accent-2: #ff3d7f; --accent-soft: color-mix(in srgb, #ff6a3d 12%, transparent);
  --ok: #1a9e6a; --warn: #d98a0b; --danger: #d6385a; --lock: #7c5cff; --lock-soft: color-mix(in srgb, #7c5cff 12%, transparent);
  --mine: linear-gradient(135deg, #3e63dd, #7c5cff);
  --e1: 0 1px 2px rgba(21,25,42,.05), 0 4px 14px -6px rgba(21,25,42,.10);
  --e2: 0 2px 4px rgba(21,25,42,.06), 0 14px 32px -12px rgba(21,25,42,.22);
  --e3: 0 4px 8px rgba(21,25,42,.08), 0 30px 70px -20px rgba(21,25,42,.35);
  --r-sm: 10px; --r: 16px; --r-lg: 24px; --r-xl: 32px;
  --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1020; --bg-blob-a: #4a1d36; --bg-blob-b: #1a2f5c; --bg-blob-c: #43300f;
  --surface: #141a2e; --surface-2: #1a2139; --surface-glass: rgba(20,26,46,.72);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #eef1f8; --text-2: #c4cbe0; --muted: #8b95ae; --primary: #eef1f8;
  --e1: 0 0 0 1px rgba(255,255,255,.04); --e2: 0 0 0 1px rgba(255,255,255,.06), 0 16px 40px -14px rgba(0,0,0,.6); --e3: 0 30px 80px -20px rgba(0,0,0,.7);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1020; --bg-blob-a: #4a1d36; --bg-blob-b: #1a2f5c; --bg-blob-c: #43300f;
  --surface: #141a2e; --surface-2: #1a2139; --surface-glass: rgba(20,26,46,.72);
  --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
  --text: #eef1f8; --text-2: #c4cbe0; --muted: #8b95ae; --primary: #eef1f8;
  --e1: 0 0 0 1px rgba(255,255,255,.04); --e2: 0 0 0 1px rgba(255,255,255,.06), 0 16px 40px -14px rgba(0,0,0,.6); --e3: 0 30px 80px -20px rgba(0,0,0,.7);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.5 var(--font); letter-spacing: -.01em; color: var(--text); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- background ---------- */
.blobs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.blobs i { position: absolute; width: 48vmax; height: 48vmax; border-radius: 50%; filter: blur(80px); opacity: .8; animation: bg-drift 30s var(--ease) infinite alternate; }
.blobs i:nth-child(1) { background: var(--bg-blob-a); left: -14vmax; top: -16vmax; }
.blobs i:nth-child(2) { background: var(--bg-blob-b); right: -18vmax; top: 8vmax; animation-delay: -10s; }
.blobs i:nth-child(3) { background: var(--bg-blob-c); left: 24vmax; bottom: -26vmax; animation-delay: -18s; }
@keyframes bg-drift { to { transform: translate(6vmax, 4vmax) scale(1.1); } }

/* ---------- window ---------- */
.window { position: relative; height: calc(100% - 68px); margin: 16px 16px 52px; border-radius: var(--r-lg); overflow: hidden; background: var(--surface-glass);
  border: 1px solid var(--border); box-shadow: var(--e3); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
  display: grid; grid-template-rows: 44px 1fr; animation: win-in .4s var(--ease) both; }
@keyframes win-in { from { opacity: 0; transform: translateY(14px) scale(.99); filter: blur(4px); } }
.titlebar { display: flex; align-items: center; gap: 8px; padding: 0 4px 0 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.titlebar .name { font-weight: 700; }
.spacer { flex: 1; }
.tb { height: 32px; padding: 0 12px; border-radius: var(--r-sm); display: inline-flex; gap: 8px; align-items: center; color: var(--text-2); transition: background .15s, color .15s; }
.tb:hover { background: var(--surface-2); color: var(--text); }
.count { min-width: 20px; height: 20px; border-radius: 99px; padding: 0 6px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-size: 12px; font-weight: 700;
  display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.count.pop { animation: pop .35s var(--spring); }
@keyframes pop { from { transform: scale(.4); } }
.winctl { display: flex; color: var(--muted); }
.winctl span { width: 44px; height: 32px; display: grid; place-items: center; }

.body { display: grid; grid-template-columns: 300px 1fr auto; min-height: 0; position: relative; }

/* ---------- avatar (shape + color + two tall white eyes) ---------- */
.av { position: relative; width: 48px; height: 48px; flex: none; display: block; }
.av svg { width: 100%; height: 100%; display: block; overflow: visible; }
.av .eyes { transform-origin: 50% 50%; animation: blink 6s infinite; animation-delay: var(--blink, 0s); }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
.av::before { content: ""; position: absolute; inset: -5px; border-radius: 50%; opacity: 0; pointer-events: none; }
.av.working::before { opacity: 1; background: conic-gradient(var(--ok), transparent 60%); animation: spin 1.4s linear infinite;
  -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%); mask: radial-gradient(circle, transparent 64%, #000 66%); }
.av.waiting::before { opacity: 1; background: radial-gradient(circle, transparent 60%, color-mix(in srgb, var(--accent) 45%, transparent) 64%, transparent 72%); animation: halo 2.4s var(--ease) infinite; }
.av.asleep svg { filter: saturate(.55); opacity: .85; }
.av .st { position: absolute; right: -2px; bottom: -2px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--surface); background: var(--muted); }
.av.working .st { background: var(--ok); } .av.waiting .st { background: var(--accent); }
@keyframes spin { to { transform: rotate(1turn); } }
@keyframes halo { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.3); opacity: 0; } }
.av.s { width: 32px; height: 32px; } .av.s .st { width: 11px; height: 11px; border-width: 2px; }
.av.l { width: 56px; height: 56px; } .av.xl { width: 96px; height: 96px; } .av.xxl { width: 120px; height: 120px; }
.av.xl .st, .av.xxl .st { display: none; }

/* ---------- left: bots ---------- */
.side { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 12px 20px; }
.side-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; margin: 0; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--e1);
  transition: transform .2s var(--spring), box-shadow .2s; }
.icon-btn:hover { transform: translateY(-2px); box-shadow: var(--e2); }
.icon-btn:active { transform: scale(.94); }
.bots { list-style: none; margin: 0; padding: 4px 12px 16px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.bots li { animation: rise .35s var(--ease) both; animation-delay: calc(min(var(--i), 12) * 50ms + 120ms); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); filter: blur(4px); } }
.row { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: var(--r); text-align: left; border: 1px solid transparent;
  transition: background .15s, transform .2s var(--spring), box-shadow .2s, border-color .15s; }
.row:hover { background: var(--surface); box-shadow: var(--e1); transform: translateY(-1px); }
.row:active { transform: scale(.98); }
.row[aria-current="true"] { background: var(--surface); border-color: var(--border); box-shadow: var(--e2); }
.row > div { min-width: 0; }
.row .n { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .l { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.badge.wait { color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 14px -6px var(--accent-2); }
.badge.lock { color: #fff; background: var(--lock); box-shadow: 0 6px 14px -6px var(--lock); }
.badge.new { color: var(--muted); background: var(--surface-2); }
.side-foot { padding: 12px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }

/* ---------- conversation ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
.head { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.head-name { display: flex; align-items: center; gap: 12px; padding: 4px 12px 4px 4px; border-radius: 99px; transition: background .15s; text-align: left; }
.head-name:hover { background: var(--surface); }
.head-name strong { display: block; font-size: 16px; font-weight: 700; line-height: 1.2; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); } .status.working i { background: var(--ok); } .status.waiting i { background: var(--accent); }
.dots { display: inline-flex; gap: 4px; } .dots b { width: 4px; height: 4px; border-radius: 50%; background: var(--ok); animation: hop 1.2s infinite; }
.dots b:nth-child(2) { animation-delay: .15s; } .dots b:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 30% { transform: translateY(-3px); } }
.chat { flex: 1; overflow-y: auto; padding: 24px 24px 112px; display: flex; flex-direction: column; gap: 12px; }
.view-in { animation: view-in .35s var(--ease) both; }
@keyframes view-in { from { opacity: 0; transform: translateY(14px); filter: blur(4px); } }
.day { align-self: center; color: var(--muted); font-size: 12px; padding: 0 12px; height: 24px; display: grid; place-items: center; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); }
.msg { display: grid; grid-template-columns: 32px 1fr; gap: 12px; max-width: 640px; animation: rise .35s var(--ease) both; animation-delay: calc(min(var(--i, 0), 12) * 50ms); }
.msg.mine { grid-template-columns: 1fr; align-self: flex-end; max-width: 480px; }
.bubble { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 6px 20px 20px 20px; padding: 12px 16px; box-shadow: var(--e1); min-width: 0; overflow-wrap: anywhere; }
.mine .bubble { background: var(--mine); color: #fff; border: 0; border-radius: 20px 6px 20px 20px; }
.bubble time { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
.mine .bubble time { color: rgba(255,255,255,.8); }
.tag { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.tag .ico { width: 14px; height: 14px; }
.ask, .secret { border-color: transparent; }
.ask::before, .secret::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2), #ffc46b); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.secret::before { background: linear-gradient(135deg, var(--lock), #b39cff); }
.secret .tag { color: var(--lock); }
.fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s var(--ease), opacity .2s; }
.fold > div { overflow: hidden; min-height: 0; }
.fold.closed { grid-template-rows: 0fr; opacity: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.choice { height: 40px; padding: 0 16px; border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--border); white-space: nowrap; transition: transform .2s var(--spring), box-shadow .2s, background .15s; }
.choice:hover { transform: translateY(-2px); box-shadow: var(--e1); background: var(--surface); }
.choice:active { transform: scale(.96); }
.choice.rec { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border: 0; color: #fff; font-weight: 700; box-shadow: 0 8px 18px -8px var(--accent-2); }
.chip-done { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; margin-top: 8px; border-radius: 99px; font-size: 12px; font-weight: 700; color: var(--ok);
  background: color-mix(in srgb, var(--ok) 14%, transparent); animation: pop .3s var(--spring) both; }
.chip-done .ico { width: 14px; height: 14px; }
.cmd { display: block; font-family: var(--mono); font-size: 12.5px; letter-spacing: 0; background: var(--lock-soft); border-radius: var(--r-sm); padding: 8px 12px; margin: 8px 0; overflow-wrap: anywhere; }
.row-in { display: flex; gap: 8px; }
.input { height: 40px; padding: 0 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--surface); outline: 0; transition: border-color .15s, box-shadow .15s; min-width: 0; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row-in .input { flex: 1; }
.btn { height: 40px; padding: 0 16px; border-radius: var(--r-sm); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; white-space: nowrap;
  position: relative; overflow: hidden; transition: transform .2s var(--spring), box-shadow .2s, background .15s; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--primary); color: var(--bg); }
.btn-accent { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 8px 18px -8px var(--accent-2); }
.btn-lock { background: var(--lock); color: #fff; }
.btn-ghost { background: var(--surface-2); border: 1px solid var(--border); font-weight: 600; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-accent::after, .btn-primary::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); transition: transform .6s var(--ease);
  background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.3) 50%, transparent 70%); }
.btn-accent:hover:not(:disabled)::after, .btn-primary:hover:not(:disabled)::after { transform: translateX(100%); }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.record { align-self: center; display: inline-flex; gap: 8px; align-items: center; font-size: 12px; color: var(--text-2); height: 32px; padding: 0 12px; border-radius: 99px; background: var(--lock-soft); }
.record .ico { width: 14px; height: 14px; color: var(--lock); }
.record code { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }

.empty { margin: auto; text-align: center; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.empty h2 { margin: 8px 0 0; font-size: 18px; font-weight: 700; }
.empty p { margin: 0; color: var(--muted); }
.empty code { font-family: var(--mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 12px; }

.composer { position: absolute; left: 24px; right: 24px; bottom: 20px; display: flex; gap: 8px; align-items: flex-end; padding: 8px 8px 8px 16px; border-radius: var(--r-lg);
  background: var(--surface-glass); border: 1px solid var(--border); box-shadow: var(--e2); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); transition: box-shadow .2s; }
.composer:focus-within { box-shadow: var(--e2), 0 0 0 4px var(--accent-soft); }
.composer textarea { flex: 1; min-width: 0; border: 0; background: none; resize: none; padding: 8px 0; max-height: 140px; outline: none; }
.send { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: transform .25s var(--spring), opacity .15s; flex: none; }
.send:disabled { opacity: .35; transform: scale(.9); cursor: default; }
.send.fly { animation: fly .4s var(--spring); }
@keyframes fly { 40% { transform: translateY(-4px) scale(.9); } }

/* ---------- info panel ---------- */
.info { width: 0; overflow: hidden; border-left: 1px solid transparent; transition: width .35s var(--ease), border-color .2s; }
.info.open { width: 360px; border-color: var(--border); }
.info-inner { width: 360px; height: 100%; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.info-top { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px 0 12px; text-align: center; flex: none; }
.info-top h2 { margin: 4px 0 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
.info-top .x { position: absolute; right: 0; top: 0; }
.link-btn { font-size: 12px; font-weight: 600; color: var(--accent); padding: 4px 8px; border-radius: 8px; }
.link-btn:hover { background: var(--accent-soft); }
.acc { flex: none; border-radius: var(--r); background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
.acc > button { width: 100%; height: 44px; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 13px; }
.acc > button .ico { transition: transform .25s var(--spring); color: var(--muted); }
.acc[data-open="true"] > button .ico { transform: rotate(90deg); }
.acc .fold > div > div { padding: 0 16px 12px; }
.acc ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.acc li { display: flex; justify-content: space-between; gap: 8px; align-items: center; background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 12px; font-size: 13px; }
.acc li small { display: block; color: var(--muted); font-size: 12px; }
.mini { height: 28px; padding: 0 8px; border-radius: 8px; color: var(--text-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.mini:hover { background: var(--surface); }
.mini.danger:hover { color: var(--danger); }
.skill { display: inline-block; font-family: var(--mono); font-size: 12px; letter-spacing: 0; background: var(--surface-2); border-radius: 8px; padding: 4px 8px; margin: 0 4px 4px 0; }
.warnline { display: flex; gap: 8px; font-size: 12px; color: var(--warn); margin-top: 8px; }
.warnline .ico { width: 16px; height: 16px; }

/* ---------- dialogs ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(12,16,32,.32); display: grid; place-items: center; padding: 16px; animation: fade .2s var(--ease) both; }
.scrim.out { animation: fade .15s var(--ease) reverse both; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--e3); padding: 32px 32px 24px;
  animation: dlg-in .3s var(--spring) both; }
.scrim.out .dialog { animation: dlg-in .15s var(--ease) reverse both; }
@keyframes dlg-in { from { opacity: 0; transform: translateY(12px) scale(.96); } }
.dialog h2 { margin: 0 0 4px; font-size: 18px; font-weight: 800; letter-spacing: -.02em; }
.preview { display: grid; place-items: center; margin: 8px 0 16px; }
.preview .av { transition: transform .25s var(--spring); }
.preview .av.bump { animation: bump .3s var(--spring); }
@keyframes bump { 50% { transform: scale(1.08) rotate(-4deg); } }
.name-in { width: 100%; height: 48px; text-align: center; font-size: 16px; font-weight: 700; border-radius: var(--r); }
.label { font-size: 12px; font-weight: 700; color: var(--muted); margin: 20px 0 8px; }
.shapes { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.shape { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; padding: 8px; transition: background .15s, transform .2s var(--spring), box-shadow .15s; }
.shape:hover { background: var(--surface-2); transform: translateY(-2px); }
.shape[aria-checked="true"] { background: var(--surface-2); box-shadow: inset 0 0 0 2px var(--border-strong); }
.shape .av { width: 100%; height: 100%; }
.colors { display: flex; flex-wrap: wrap; gap: 8px; }
.color { width: 32px; height: 32px; border-radius: 50%; background: var(--c); transition: transform .2s var(--spring), box-shadow .15s; }
.color:hover { transform: scale(1.1); }
.color[aria-checked="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--c); }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
.confirm { width: min(400px, 100%); text-align: center; }
.confirm p { color: var(--text-2); margin: 8px 0 0; }

/* ---------- toast, notification, review bar ---------- */
.toast { position: fixed; left: 50%; bottom: 32px; z-index: 60; display: inline-flex; gap: 8px; align-items: center; transform: translateX(-50%); background: var(--primary); color: var(--bg);
  padding: 0 16px; height: 40px; border-radius: 99px; font-size: 13px; font-weight: 600; box-shadow: var(--e2); animation: toast 2.8s var(--ease) both; }
.toast .ico { width: 16px; height: 16px; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 16px) scale(.94); } 10%, 88% { opacity: 1; transform: translate(-50%, 0) scale(1); } 100% { opacity: 0; transform: translate(-50%, -8px); } }
.os-note { position: fixed; right: 28px; bottom: 28px; z-index: 50; width: 360px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 12px 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--e3); text-align: left; animation: note-in .35s var(--spring) both; }
.os-note.out { animation: note-in .25s var(--ease) reverse both; }
@keyframes note-in { from { opacity: 0; transform: translateX(110%); } }
.os-note small { color: var(--muted); font-size: 12px; display: block; }
.os-note b { display: block; font-size: 13px; }
.review { position: fixed; left: 16px; bottom: 10px; z-index: 30; display: flex; gap: 4px; align-items: center; padding: 4px; border-radius: var(--r); background: var(--surface); border: 1px dashed var(--border-strong); font-size: 12px; }
.review span { color: var(--muted); padding: 0 8px; }
.review button { height: 28px; padding: 0 12px; border-radius: 10px; background: var(--surface-2); font-size: 12px; }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: .25s; }
@media (max-width: 1100px) {
  .body { grid-template-columns: 260px 1fr; }

}

    <span class="spacer"></span>
    <button class="tb" id="bell" aria-label="あなた待ちを開く"><svg class="ico" data-i="bell"></svg><span class="count" id="count">0</span></button>

</div>

function answer(item, label, fold) {
  const b = bot(); item.answered = label; fold.classList.add("closed");
  later(() => { b.talk.push({ day: "11/19", t: now(), from: "me", text: label, sent: "届けました" }); if (!waits(b)) { b.status = "working"; b.line = "続きから作業中"; } renderAll(); toast("答えを " + b.name + " に届けました", "check"); }, 300);
}

// ---------- info panel ----------
function accordion(title, open, body) {
  const box = el("div", "acc"); box.dataset.open = open;
  const head = el("button"); head.setAttribute("aria-expanded", open); head.append(el("span", null, title), ico("chev"));
  const fold = el("div", "fold" + (open ? "" : " closed")), inner = el("div"), pad = el("div"); pad.append(...body); inner.append(pad); fold.append(inner);
  head.onclick = () => { const o = box.dataset.open !== "true"; box.dataset.open = o; head.setAttribute("aria-expanded", o); fold.classList.toggle("closed", !o); };
  box.append(head, fold); return box;
}
function list(items) { const u = el("ul"); items.forEach(li => u.append(li)); if (!items.length) u.append(el("li", null, "まだありません")); return u; }
function renderInfo() {
  const b = bot(), box = document.getElementById("infoInner"); box.textContent = "";
  const top = el("div", "info-top"), x = el("button", "icon-btn x"); x.setAttribute("aria-label", "閉じる"); x.append(ico("x")); x.onclick = () => openInfo(false);
  const look = el("button", "link-btn"); look.append("見た目を変える"); look.onclick = () => avatarDialog(b);
  top.append(x, avatar(b, "xl"), el("h2", null, b.name), status(b), look);
  const desc = el("p", null, b.desc); desc.style.margin = "0";
  const mem = list(b.memory.map(([f, d]) => { const li = el("li"), t = el("div", null, f); t.append(el("small", null, d + " に覚えた")); li.append(t, el("button", "mini danger", "忘れて")); li.lastChild.onclick = () => { b.memory = b.memory.filter(m => m[0] !== f); renderInfo(); toast("忘れました(控えは残してあります)", "check"); }; return li; }));
  const rou = list(b.routines.map(([n, w]) => { const li = el("li"), t = el("div", null, n); t.append(el("small", null, w)); const s = el("button", "mini", "止めてと頼む");
    s.onclick = () => { b.talk.push({ day: "11/19", t: now(), from: "me", text: "ルーティン「" + n + "」を止めて", sent: "届けました" }); renderChat(); toast(b.name + " に頼みました", "check"); }; li.append(t, s); return li; }));
  const sk = el("div"); SKILLS.forEach(s => sk.append(el("span", "skill", s)));
  const ph = list(PHONES.map(p => { const li = el("li"), t = el("div", null, p.name); t.append(el("small", null, "最後に使った: " + p.seen), el("small", null, "最後の登録: " + p.last));
    const rm = el("button", "mini danger", "外す"); rm.onclick = () => confirmDialog(p.name + " を外しますか?", "外すと、この電話から kantoku bot を開けなくなります。もう一度使うには PC でつなぎ直します。", "外す", () => { PHONES.splice(PHONES.indexOf(p), 1); renderAll(); toast(p.name + " を外しました", "check"); });
    li.append(t, rm); return li; }));
  const pair = el("button", "btn btn-accent"); pair.append(ico("plus"), "電話をつなぐ"); pair.style.marginTop = "8px"; pair.onclick = () => toast("6 けたの数字: 482 913(10 分だけ)", "phone");
  const warn = el("div", "warnline"); warn.append(ico("alert"), el("span", null, "つないだ電話は、あなたとして答え・話しかけ・秘密の登録までできます。なくしたらすぐ外してください。"));
  box.append(top,
    accordion("説明", infoFocus !== "phones", [desc, el("p", "note", "やらないこと: " + (b.nots.join("、") || "なし"))]),
    accordion("覚えていること", false, [mem]), accordion("ルーティン", false, [rou]), accordion("スキル(みんなで共有)", false, [sk]),
    accordion("つないだ電話", infoFocus === "phones", [ph, pair, warn]));
}
function openInfo(on, focus) { infoOpen = on; infoFocus = focus || null; document.getElementById("info").classList.toggle("open", on); if (on) renderInfo(); }

// ---------- dialogs (focus moves in, Tab stays in, Esc closes, focus returns) ----------
function modal(build) {
  const opener = document.activeElement, scrim = el("div", "scrim"), dlg = el("div", "dialog"); dlg.setAttribute("role", "dialog"); dlg.setAttribute("aria-modal", "true");
  const close = () => { scrim.classList.add("out"); later(() => scrim.remove(), 150); document.removeEventListener("keydown", onKey, true); opener?.focus?.(); };
  function onKey(e) {
    if (e.key === "Escape") { e.preventDefault(); close(); }
    if (e.key === "Tab") { const f = [...dlg.querySelectorAll("button, input, [tabindex='0']")].filter(x => !x.disabled); if (!f.length) return; const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
  }
  build(dlg, close); scrim.append(dlg); scrim.onclick = e => { if (e.target === scrim) close(); }; document.body.append(scrim);
  document.addEventListener("keydown", onKey, true); (dlg.querySelector("[autofocus]") || dlg.querySelector("button, input"))?.focus();
}
function confirmDialog(title, body, ok, onOk) {
  modal((dlg, close) => { dlg.classList.add("confirm"); const foot = el("div", "dlg-foot"), no = el("button", "btn btn-ghost", "やめる"), yes = el("button", "btn btn-danger", ok);
    no.onclick = close; yes.onclick = () => { close(); onOk(); }; foot.style.justifyContent = "center"; foot.append(no, yes); dlg.append(el("h2", null, title), el("p", null, body), foot); no.autofocus = true; });
}
// The "new bot" dialog, after Grok Bot's: big avatar, name, 13 shapes, 11 colors, Cancel / Create.
function avatarDialog(editing) {
  modal((dlg, close) => {
    const start = editing ? lookOf(editing) : { shape: "cloud", color: "blue" };
    let shape = start.shape, color = start.color;
    const prev = el("div", "preview"), name = el("input", "input name-in"); name.placeholder = "Bot に名前を付ける"; name.setAttribute("aria-label", "名前"); name.maxLength = 40;
    if (editing) { name.value = editing.name; name.disabled = true; } else name.autofocus = true;
    const draw = bump => { prev.textContent = ""; const a = avatar({ name: name.value || "x", shape, color }, "xxl", null); if (bump && !reduce()) a.classList.add("bump"); prev.append(a); };
    const shapes = el("div", "shapes"); shapes.setAttribute("role", "radiogroup"); shapes.setAttribute("aria-label", "形");
    Object.entries(SHAPES).forEach(([key, s]) => { const btn = el("button", "shape"); btn.type = "button"; btn.setAttribute("role", "radio"); btn.setAttribute("aria-label", s.label); btn.setAttribute("aria-checked", key === shape);
      btn.append(avatar({ name: key, shape: key, color }, null, null)); btn.onclick = () => { shape = key; shapes.querySelectorAll(".shape").forEach(x => x.setAttribute("aria-checked", x === btn)); draw(true); }; shapes.append(btn); });
    const colors = el("div", "colors"); colors.setAttribute("role", "radiogroup"); colors.setAttribute("aria-label", "色");
    Object.entries(COLORS).forEach(([key, hex]) => { const btn = el("button", "color"); btn.type = "button"; btn.style.setProperty("--c", hex); btn.setAttribute("role", "radio"); btn.setAttribute("aria-label", key); btn.setAttribute("aria-checked", key === color);
      btn.onclick = () => { color = key; colors.querySelectorAll(".color").forEach(x => x.setAttribute("aria-checked", x === btn)); shapes.querySelectorAll(".shape").forEach((s, i) => { s.textContent = ""; const k = Object.keys(SHAPES)[i]; s.append(avatar({ name: k, shape: k, color }, null, null)); }); draw(true); }; colors.append(btn); });
    const foot = el("div", "dlg-foot"), cancel = el("button", "btn btn-ghost", "キャンセル"), ok = el("button", "btn btn-primary", editing ? "保存" : "作成");
    const valid = () => editing || (/^[A-Za-z0-9_-]{1,40}$/.test(name.value) && !BOTS.some(b => b.name.toLowerCase() === name.value.toLowerCase()));
    ok.disabled = !valid(); name.oninput = () => { ok.disabled = !valid(); draw(false); };
    cancel.onclick = close;
    ok.onclick = () => {
      if (editing) { editing.shape = shape; editing.color = color; close(); renderAll(); toast("見た目を変えました", "check"); return; }
      BOTS.push({ name: name.value, shape, color, status: "new", line: "まだ動いていません", desc: "", nots: [], memory: [], routines: [], talk: [] });
      current = BOTS.length - 1; close(); swap(renderAll); toast(name.value + " を作りました", "check");
    };
    foot.append(cancel, ok);
    dlg.append(el("h2", null, editing ? "見た目を変える" : "新しい Bot を作成"), prev, name, el("div", "label", "形"), shapes, el("div", "label", "色"), colors, foot);
    draw(false);
  });
}

function renderAll() { renderList(); renderChat(); if (infoOpen) renderInfo(); }

// ---------- composer ----------
const say = document.getElementById("say"), sendBtn = document.getElementById("sendBtn");
say.addEventListener("input", () => { sendBtn.disabled = !say.value.trim(); say.style.height = "auto"; say.style.height = say.scrollHeight + "px"; });
say.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); document.getElementById("composer").requestSubmit(); } });
document.getElementById("composer").addEventListener("submit", e => {
  e.preventDefault(); const text = say.value.trim(); if (!text) return;
  const b = bot(), idx = say.dataset.answerFor; sendBtn.classList.remove("fly"); void sendBtn.offsetWidth; sendBtn.classList.add("fly");
  say.value = ""; say.style.height = "auto"; sendBtn.disabled = true; say.placeholder = b.name + " に話しかける…";
  if (idx != null && b.talk[idx]) { delete say.dataset.answerFor; b.talk[idx].answered = text; b.talk.push({ day: "11/19", t: now(), from: "me", text, sent: "届けました" }); if (!waits(b)) { b.status = "working"; b.line = "続きから作業中"; } renderAll(); return; }
  const asleep = b.status === "asleep" || b.status === "new";
  b.talk.push({ day: "11/19", t: now(), from: "me", text, sent: asleep ? "起きたら読みます" : "届けました" });
  if (b.status === "new") b.status = "asleep";
  renderAll(); toast(asleep ? b.name + " は眠っています。起きたら読みます" : b.name + " に届けました", "check");
});

document.getElementById("headName").onclick = () => openInfo(!infoOpen);
document.getElementById("phones").onclick = () => openInfo(true, "phones");
document.getElementById("newBot").onclick = () => avatarDialog(null);
document.getElementById("bell").onclick = () => { const i = BOTS.findIndex(b => waits(b)); if (i >= 0) swap(() => { current = i; renderAll(); }); else toast("あなた待ちはありません", "check"); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && infoOpen && !document.querySelector(".scrim")) openInfo(false); });

// ---------- review-only controls ----------
document.getElementById("demoNote").onclick = () => {
  const b = BOTS[0], n = el("button", "os-note"); const t = el("div"); t.append(el("small", null, "kantoku bot ・ いま"), el("b", null, b.name + " があなた待ち"), el("span", null, "開いて答えてください"));
  n.append(avatar(b, null, null), t); document.body.append(n);
  const close = () => { n.classList.add("out"); later(() => n.remove(), 250); };
  n.onclick = () => { close(); swap(() => { current = 0; renderAll(); }); }; setTimeout(close, 5000);
};
document.getElementById("demoMotion").onclick = e => { const off = document.documentElement.dataset.motion !== "off"; document.documentElement.dataset.motion = off ? "off" : "on"; e.target.textContent = off ? "動きをもどす" : "動きを止める"; };
document.getElementById("demoTheme").onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; };

document.getElementById("appIcon").append(avatar({ name: "kantoku", shape: "cloud", color: "pink" }, "s", null));
renderAll();
</script>
